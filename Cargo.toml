[workspace]
resolver = "3"
members = ["crates/moearc-engine"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/chrisdesrochers/MoEArc"
authors = ["Superabundant LLC"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Optimise dependencies even in dev builds. Inference work is dominated by time spent in
# dependencies, and an unoptimised debug build of them is slow enough to distort any
# timing taken during development.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
