[package]
name = "moearc-device"
description = "GPU device discovery for MoEArc: enumerate Level Zero devices and report usable VRAM."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
thiserror.workspace = true

# Level Zero is opened with dlopen at runtime rather than linked at build time. See the
# module docs in `src/ze.rs` for why this is a product requirement and not a preference.
libloading = "0.8"

[[bin]]
name = "moearc-device-report"
path = "src/bin/report.rs"
