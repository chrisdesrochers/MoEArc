[package]
name = "moearc-server"
description = "OpenAI-compatible HTTP serving layer: tokenisation, chat templating, sampling."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "moearc-server"
path = "src/bin/moearc-server.rs"

[features]
default = []
# Wires the real engine in. Pulls moearc-engine/gpu, which needs Intel DPC++
# at build time -- hence opt-in, so the serving path stays buildable anywhere.
engine = ["dep:moearc-engine", "moearc-engine/gpu"]

[dependencies]
moearc-engine = { workspace = true, optional = true }
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true

axum = "0.8"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures-core = "0.3"
clap = { version = "4.6", features = ["derive"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
minijinja = { version = "2.24", features = ["json", "loop_controls"] }
minijinja-contrib = { version = "2.24", features = ["pycompat"] }
tokenizers = { version = "0.23", default-features = false, features = ["onig"] }

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures-util = "0.3"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
