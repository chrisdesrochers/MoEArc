[package]
name = "moearc-model"
description = "Model discovery, metadata and download for MoEArc."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
thiserror.workspace = true
hf-hub = { version = "1.0.0", features = ["rustls-tls"] }
# Mapping, not reading: a model file is larger than the RAM budget the whole engine has.
memmap2 = "0.9"
tokio = { version = "1", features = ["rt", "net", "time"] }
futures-util = "0.3"
libc = "0.2"
