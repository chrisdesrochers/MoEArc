[package]
name = "moearc-cli"
description = "The moearc binary: device report, model picker, and server launcher."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "moearc"
path = "src/main.rs"

[features]
default = []
# The device half of the engine. `moearc bench --absolutes` cannot time anything without it,
# and says so rather than reporting a figure from a binary that cannot reach the card.
gpu = ["moearc-engine/gpu"]

[dependencies]
moearc-engine.workspace = true
moearc-device.workspace = true
moearc-model.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true

clap = { version = "4.6", features = ["derive"] }
crossterm = "0.29"
ratatui = { version = "0.30", default-features = false, features = ["crossterm", "crossterm_0_29", "layout-cache", "underline-color", "all-widgets"] }
tui-input = { version = "0.15", default-features = false, features = ["ratatui", "ratatui-crossterm"] }
throbber-widgets-tui = "0.11"
# Host RAM and free space. Already in this binary's dependency graph -- `hf-hub` reaches it
# through `hf-xet` -> `xet-runtime` -- so naming it here adds a line to a manifest and nothing
# to the build. Only the two feature sets we read are enabled.
sysinfo = { version = "0.38", default-features = false, features = ["system", "disk"] }
